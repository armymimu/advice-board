<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advice Price Board</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header-container">
    <div class="header-top">
      <div class="logo-group">
        <div class="logo-icon"><i class="fas fa-tags"></i></div>
        <div class="logo-text">
          <h1>Advice Price Board</h1>
        </div>
      </div>
      
      <div class="profit-control">
        <label for="global-profit">กำไรต่อเครื่อง:</label>
        <div class="profit-input-wrap">
          <input type="number" id="global-profit" value="1000" min="0" step="100">
          <span class="profit-unit">฿</span>
        </div>
      </div>
    </div>

    <div class="toolbar-container">
      <div class="tabs" id="category-tabs">
        <button class="tab-btn active" data-cat="iphone">iPhone</button>
        <button class="tab-btn" data-cat="ipad">iPad</button>
        <button class="tab-btn" data-cat="macbook">Mac</button>
        <button class="tab-btn" data-cat="android">Android</button>
      </div>

      <div class="toolbar-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="search-input" placeholder="ค้นหารุ่น...">
        </div>
        <button id="btn-copy-visible" class="btn-secondary" title="คัดลอกผลที่แสดง">
          <i class="fas fa-copy"></i> คัดลอกผลที่แสดง
        </button>
        <button id="btn-copy-all" class="btn-primary" title="คัดลอกทุกรุ่น">
          <i class="fas fa-clone"></i> คัดลอกทุกรุ่น
        </button>
      </div>
    </div>
  </header>

  <div class="status-bar" id="status-bar">
    <!-- Status will be injected here -->
  </div>

  <main class="main-content">
    <div id="loading-state" class="state-view">
      <div class="spinner"></div>
      <h3>กำลังเชื่อมต่อระบบ Advice...</h3>
      <p style="font-size: 13px; margin-top: 8px;">(หากเข้าใช้งานครั้งแรกอาจใช้เวลาปลุกเซิร์ฟเวอร์ 30-50 วินาที)</p>
    </div>

    <div id="error-state" class="state-view" style="display: none;">
      <!-- Error injected here -->
    </div>

    <div id="products-grid">
      <!-- Cards injected here -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
